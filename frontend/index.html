<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f7f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gatepass" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      if (/^\/(staff|admin)(\/|$)/.test(location.pathname)) {
        document.querySelector('link[rel="manifest"]').href = '/staff-manifest.json';
        document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', 'Gatepass Staff');
      }
    </script>
    <title>Gatepass · Visitor Management System</title>
    <style>
      @layer theme, base, legacy, components, utilities;
      @layer legacy {
        .vms-logo { display: block; width: 100%; height: 100%; overflow: visible; }
        .vms-logo-tile { fill: #1a1714; }
        .vms-logo-arch,
        .vms-logo-sill { fill: none; stroke-linecap: round; stroke-width: 3.4; }
        .vms-logo-arch { stroke: #e8b96a; }
        .vms-logo-sill { stroke: #c9922a; }
        .vms-logo-dot { fill: #e8b96a; }
        .boot {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: grid;
          place-items: center;
          background: radial-gradient(circle at 50% 40%, #fdf3e3 0%, #f9f7f4 46%);
          color: #1a1714;
        }
        .boot.is-done { opacity: 0; visibility: hidden; }
        .boot-inner {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .boot-mark { width: 84px; height: 84px; filter: drop-shadow(0 20px 32px rgba(26, 23, 20, 0.28)); }
        .boot-word {
          margin-top: 22px;
          font: 600 30px/1 'Cormorant Garamond', Georgia, serif;
          letter-spacing: 0.01em;
        }
        .boot-sub {
          margin-top: 8px;
          font: 600 10.5px/1 'Outfit', system-ui, sans-serif;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          color: #a39d96;
        }
        .boot-bar {
          position: relative;
          width: 120px;
          height: 3px;
          margin-top: 24px;
          border-radius: 999px;
          overflow: hidden;
          background: #e8e2d9;
        }
        .boot-bar::after {
          content: '';
          position: absolute;
          inset: 0 auto 0 0;
          width: 40%;
          border-radius: inherit;
          background: #c9922a;
        }
        .boot-stall { display: none; margin-top: 26px; text-align: center; font: 400 14px/1.5 'Outfit', system-ui, sans-serif; color: #6b645c; }
        .boot.is-stalled .boot-stall { display: block; }
        .boot-stall p { margin: 0 0 14px; }
        .boot-stall-actions { display: flex; gap: 10px; justify-content: center; }
        .boot-stall button {
          min-height: 40px;
          padding: 0 18px;
          border: 1px solid #d9d1c5;
          border-radius: 999px;
          background: #fff;
          color: #1a1714;
          font: 600 13px/1 'Outfit', system-ui, sans-serif;
          white-space: nowrap;
          cursor: pointer;
        }
        .boot-stall button[data-boot-action='reload'] { border-color: #1a1714; background: #1a1714; color: #f9f7f4; }
        .boot-status {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }
        @media (prefers-reduced-motion: no-preference) {
          .vms-logo.is-animated .vms-logo-arch {
            stroke-dasharray: 1 1;
            animation: vmsArch 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
          }
          .vms-logo.is-animated .vms-logo-sill,
          .vms-logo.is-animated .vms-logo-dot { transform-box: fill-box; transform-origin: center; }
          .vms-logo.is-animated .vms-logo-sill { animation: vmsSill 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
          .vms-logo.is-animated .vms-logo-dot { animation: vmsDot 2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
          @keyframes vmsArch {
            0% { stroke-dashoffset: 1; }
            38%, 74% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -1; }
          }
          @keyframes vmsSill {
            0%, 8% { transform: scaleX(0); }
            34%, 78% { transform: scaleX(1); }
            96%, 100% { transform: scaleX(0); }
          }
          @keyframes vmsDot {
            0%, 30% { opacity: 0; transform: translateY(12px) scale(0.6); }
            48% { opacity: 1; transform: translateY(0) scale(1.25); }
            58%, 76% { opacity: 1; transform: translateY(0) scale(1); }
            92%, 100% { opacity: 0; transform: translateY(0) scale(0.4); }
          }
          .boot { transition: opacity 0.35s ease, visibility 0.35s ease; }
          .boot-inner { opacity: 0; animation: bootIn 0.45s ease 0.18s forwards; }
          .boot-bar::after { animation: bootBar 1.3s ease-in-out infinite; }
          .boot.is-stalled .boot-stall { animation: bootIn 0.3s ease forwards; }
          @keyframes bootIn { to { opacity: 1; } }
          @keyframes bootBar {
            from { transform: translateX(-100%); }
            to { transform: translateX(250%); }
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" class="boot">
      <output id="boot-status" class="boot-status">Loading Gatepass</output>
      <div class="boot-inner">
        <svg class="vms-logo is-animated boot-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect class="vms-logo-tile" width="64" height="64" rx="18" />
          <path class="vms-logo-arch" d="M21 45V29a11 11 0 0 1 22 0v16" pathLength="1" />
          <path class="vms-logo-sill" d="M15 45h34" />
          <circle class="vms-logo-dot" cx="32" cy="36" r="3.6" />
        </svg>
        <span class="boot-word">Gatepass</span>
        <span class="boot-sub">Visitor desk</span>
        <span class="boot-bar"></span>
        <div class="boot-stall">
          <p>This is taking longer than usual.</p>
          <div class="boot-stall-actions">
            <button type="button" data-boot-action="reload">Reload</button>
            <button type="button" data-boot-action="login">Log in again</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        window.setTimeout(function () {
          if (document.getElementById('boot') && !boot.classList.contains('is-done')) {
            boot.classList.add('is-stalled');
            document.getElementById('boot-status').textContent = 'Gatepass is taking longer than usual to load.';
          }
        }, 12000);
        boot.addEventListener('click', function (event) {
          var action = event.target.dataset.bootAction;
          if (action === 'reload') window.location.reload();
          if (action === 'login') {
            ['access_token', 'refresh_token', 'user'].forEach(function (key) { localStorage.removeItem(key); });
            window.location.replace('/staff/login');
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
